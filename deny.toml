# ai-env (plans/relay-security-plan.md E.2): make check-advisories runs `cargo deny --workspace check advisories`.
[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Not gated: only `check advisories` runs. Slice I fills `allow` from `cargo deny list` so a manual
# `cargo deny check licenses` passes (31 Oct 2026; LGPL-2.1-or-later, which r-efi offers beside MIT and Apache-2.0,
# is left out).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
