[package]
name = "ai-env-cli"
description = "ai-env: encrypted .env files that stay .env, unlocked by Touch ID"
version.workspace = true
edition.workspace = true
# Literal on purpose: aws-sdk-lambdamicrovms 1.8.0 needs 1.94.1; ai-env-age
# keeps the workspace 1.88.
rust-version = "1.94.1"
license.workspace = true
repository.workspace = true
# src/main.rs is gone: never auto-discover a third bin named `ai-env-cli`.
autobins = false
# Every integration test is declared below with its required-features.
autotests = false
# The only example is the negative clippy fixture, declared below; never auto-discovered.
autoexamples = false

[lib]
name = "ai_env_cli"
path = "src/lib.rs"

[[bin]]
name = "ai-env"
path = "src/bin/ai-env.rs"
test = false

# The Cursor wrapper; skipped silently by shim-only builds.
[[bin]]
name = "ai-env-claude"
path = "src/bin/ai-env-claude.rs"
test = false
required-features = ["bridge"]

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "container"
path = "tests/container.rs"

[[test]]
name = "hardware"
path = "tests/hardware.rs"

[[test]]
name = "wrapper"
path = "tests/wrapper.rs"
required-features = ["bridge"]

[[test]]
name = "route"
path = "tests/route.rs"
required-features = ["bridge"]

[[test]]
name = "wrapper_install"
path = "tests/wrapper_install.rs"
required-features = ["bridge"]

[[test]]
name = "wrapper_status"
path = "tests/wrapper_status.rs"
required-features = ["bridge"]

[[test]]
name = "hoststate"
path = "tests/hoststate.rs"
required-features = ["bridge"]

[[test]]
name = "mirror"
path = "tests/mirror.rs"
required-features = ["bridge"]

[[test]]
name = "race"
path = "tests/race.rs"
required-features = ["bridge"]

[[test]]
name = "aws"
path = "tests/aws.rs"
required-features = ["bridge"]

# Mutates AWS_REGION/AWS_DEFAULT_REGION: alone in its own process so it never races `aws`.
[[test]]
name = "aws_region"
path = "tests/aws_region.rs"
required-features = ["bridge"]

[[test]]
name = "claude_live"
path = "tests/claude_live.rs"
required-features = ["bridge"]

[[test]]
name = "shim_local"
path = "tests/shim_local.rs"
required-features = ["shim"]

# S6: the real shim (native, log mode) and the real `ai-env vm exec` through the tests' fake endpoint
# (the debug-build knob AI_ENV_BRIDGE_LAB_AGENT_ADDR): transport_local + exec_local.
[[test]]
name = "shim_bridge_local"
path = "tests/shim_bridge_local.rs"
required-features = ["shim", "bridge"]

# S6: the Mac's TLS policy against local listeners (openssl s_server at test time: self-signed, TLS 1.2-only),
# the proxy environment ignored, exactly one crypto provider.
[[test]]
name = "tls_policy"
path = "tests/tls_policy.rs"
required-features = ["bridge"]

# Opt-in (AI_ENV_DOCKER_TESTS=1, every test #[ignore]d): the shim inside the AL2023
# base image and the locally built image (`make test-docker`).
[[test]]
name = "shim_docker"
path = "tests/shim_docker.rs"
required-features = ["shim"]

# Opt-in (AI_ENV_DOCKER_TESTS=1, every test #[ignore]d): the real `ai-env vm exec` against the
# locally built image through the tests' fake endpoint (`make test-docker`, after shim_docker).
[[test]]
name = "docker_exec"
path = "tests/docker_exec.rs"
required-features = ["bridge"]

# Opt-in (AI_ENV_PROXY_TESTS=1, every test #[ignore]d): squid on AL2023 with the S5 proxy
# config, reload script and allowlist (`make test-proxy`); uses the lib's log parser and hashes.
[[test]]
name = "proxy_docker"
path = "tests/proxy_docker.rs"
required-features = ["bridge"]

# S3 infra helpers through the real binary; the areas live in tests/infra/*.rs.
[[test]]
name = "infra"
path = "tests/infra.rs"
required-features = ["bridge"]

# S10 addendum A1: `creds account check` through the real binary, against a fake Cursor bundle's claude
# (tests/fakes/claude-usage.sh) and the fake age.
[[test]]
name = "accounts_check"
path = "tests/accounts_check.rs"
required-features = ["bridge"]

# S4 MicroVM lifecycle in-process against the fakes; the areas live in tests/vm/*.rs.
[[test]]
name = "vm"
path = "tests/vm.rs"
required-features = ["bridge"]

# S8 (wave 1, W2): the real `ai-env-claude` in remote mode through the tests' fake endpoint, routed per port, to
# the in-process shim with fs_root (tests/common/remote.rs); declared in phase 0 with ignored placeholders.
[[test]]
name = "remote_pump"
path = "tests/remote_pump.rs"
required-features = ["bridge", "shim"]

# S8 (wave 1, W4): the Mac's workspace data plane (resolve, the WIP, the shallow pack, the scans, box seed and
# box fetch) against the native shim; the areas will live in tests/workspace/*.rs.
[[test]]
name = "workspace"
path = "tests/workspace.rs"
required-features = ["bridge", "shim"]

# S8 (wave 1, W2): the `auth status` prewarm (the sibling `vm warm --prewarm` detached, and when it is not started).
[[test]]
name = "prewarm"
path = "tests/prewarm.rs"
required-features = ["bridge"]

# S8 (wave 2, W9): the README's and SKILL.md's `sh doc-test` blocks run in their dry forms (`make doc-test`; part
# of `make test`).
[[test]]
name = "readme"
path = "tests/readme.rs"
required-features = ["bridge"]

# Opt-in (AI_ENV_CURSOR_TESTS=1, every test #[ignore]d; `make test-cursor STEP=…`, S8 wave 2, W7): the evidence
# checks after Mike's Cursor steps in S8 part B (census, registry, audit, lab rows and git refs, through the real
# commands).
[[test]]
name = "cursor_live"
path = "tests/cursor_live.rs"
required-features = ["bridge"]

# S9 (wave 1, G3): `box review`, `box hook-install` and the pre-push hook; declared in phase 0 with an ignored
# placeholder.
[[test]]
name = "review"
path = "tests/review.rs"
required-features = ["bridge"]

# S9 (wave 1, G4): the S3 transcript store on the Mac against the tests' S3 (tests/common/fake_s3.rs) and the fake
# API; declared in phase 0 with an ignored placeholder.
[[test]]
name = "s3_store"
path = "tests/s3_store.rs"
required-features = ["bridge", "shim"]

# S9 (wave 1, G7): the fake git's descriptor test in a binary of its own; declared in phase 0 with an ignored
# placeholder.
[[test]]
name = "workspace_fd"
path = "tests/workspace_fd.rs"
required-features = ["bridge", "shim"]

# S10 (wave 1b, C): the continuity engine end to end (re-address, migration, `session migrate`, the reaper) on the
# multi-VM rig; the rig's own self-tests in tests/continuity/rig.rs (wave 1a, R). Declared in phase 0 with ignored
# placeholders.
[[test]]
name = "continuity"
path = "tests/continuity.rs"
required-features = ["bridge", "shim"]

# S10 (wave 1b, P): parking an idle remote session, against the in-process shim; declared in phase 0 with an
# ignored placeholder.
[[test]]
name = "parking"
path = "tests/parking.rs"
required-features = ["bridge", "shim"]

# S11 (wave 1, A2): `ai-env claude` (admit, stage, update, gc, forget, status) through the real binary under the fake
# API, its release curl, gpgv and make the lab knobs' fakes; declared in phase 0 with an ignored placeholder.
[[test]]
name = "claude_cmd"
path = "tests/claude_cmd.rs"
required-features = ["bridge", "shim"]

# S11 (wave 1, B2): `ai-env audit tail|grep`, `ai-env cost`, `session list|show` and `vm list` on the s11 fixtures;
# declared in phase 0 with an ignored placeholder.
[[test]]
name = "control"
path = "tests/control.rs"
required-features = ["bridge"]

# S11 (wave 1, B1): the loopback panel (`ai-env panel serve`) over raw HTTP/1.1; declared in phase 0 with an ignored
# placeholder.
[[test]]
name = "panel"
path = "tests/panel.rs"
required-features = ["bridge"]

# Negative fixture for `make lint-negative`: clippy must REJECT it (every clippy.toml
# disallowed method is called once). Built only with the lint-negative feature.
[[example]]
name = "tls_lint_negative"
path = "examples/tls_lint_negative.rs"
required-features = ["lint-negative"]

[features]
default = ["bridge", "shim"]
# Mac side: AWS control plane, TLS client stack, WebSocket client.
bridge = [
    # S11 B.5: the loopback panel (ai-env panel serve), on the shim's pinned axum (no new crate)
    "dep:axum",
    "dep:aws-config",
    "dep:aws-sdk-lambdamicrovms",
    "dep:aws-smithy-http-client",
    "dep:aws-sigv4",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    # S13 (M): the relay's shared formats (keys, session tokens, the lists, the agent's protocol, the
    # certificates); never the worker runtime (`make check-features`, B-11)
    "dep:ai-env-worker",
    "tokio-tungstenite/connect",
    # This feature is the only public way to obtain `Connector::Rustls`; it pulls
    # webpki-roots 0.26 (a re-export of the pinned 1.0.9) which tls.rs never uses —
    # the WS client installs its own root store.
    "tokio-tungstenite/rustls-tls-webpki-roots",
]
# VM side: HTTP listeners, WebSocket server via the hyper upgrade, PID-1 duties.
shim = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:nix"]
# `make lint-negative` only: builds examples/tls_lint_negative.rs, which clippy must reject.
lint-negative = ["bridge"]

[dependencies]
# classic
ai-env-age = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
libc = { workspace = true }
memsec = { workspace = true }
ratatui = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }
# every feature set
getrandom = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true } # non-optional: `handshake` in every build
futures-util = { workspace = true } # the S4 shell pump (vm/shell.rs); the S6 agent pump
http = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true } # S2 pump: fresh request ids (v7) for a replay
subtle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = { workspace = true }
# bridge
aws-config = { workspace = true, optional = true }
aws-sdk-lambdamicrovms = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true } # built by src/bridge/tls.rs only (`make lint` greps)
aws-sigv4 = { workspace = true, optional = true } # S7: GetNetworkConnector, the one call the SDK does not model
# S13 (M): `default-features = false` in the workspace entry: the shared formats, never the runtime
ai-env-worker = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# shim
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true } # S6 `/agent`: the upgrade (`hyper::upgrade::OnUpgrade`)
hyper-util = { workspace = true, optional = true } # S6 `/agent`: `TokioIo` over the upgraded connection
nix = { workspace = true, optional = true } # S3 PID-1 init, signals, prctl

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# S13 (I2, WM-J3 and WM-J4: tests/infra/relay_joint.rs): the relay, the VM's relay client and the worker runtime,
# in the tests only; never in ai-env-cli's normal graphs (`make check-features`)
ai-env-relay = { workspace = true }
ai-env-relay-client = { workspace = true }
ai-env-worker = { workspace = true, features = ["runtime"] }
