[package]
name = "ai-env-cli"
description = "ai-env: encrypted .env files that stay .env, unlocked by Touch ID"
version.workspace = true
edition.workspace = true
# Literal on purpose: aws-sdk-lambdamicrovms 1.8.0 needs 1.94.1; ai-env-age
# keeps the workspace 1.88.
rust-version = "1.94.1"
license.workspace = true
repository.workspace = true
# src/main.rs is gone: never auto-discover a third bin named `ai-env-cli`.
autobins = false
# Every integration test is declared below with its required-features.
autotests = false
# The only example is the negative clippy fixture, declared below; never auto-discovered.
autoexamples = false

# Dependencies pinned by the plan ahead of the stage that consumes them (see the
# trailing comment on each line under [dependencies]); `make check-deps` runs cargo machete.
[package.metadata.cargo-machete]
ignored = ["hyper", "hyper-util", "http-body-util"]

[lib]
name = "ai_env_cli"
path = "src/lib.rs"

[[bin]]
name = "ai-env"
path = "src/bin/ai-env.rs"
test = false

# The Cursor wrapper; skipped silently by shim-only builds.
[[bin]]
name = "ai-env-claude"
path = "src/bin/ai-env-claude.rs"
test = false
required-features = ["bridge"]

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "container"
path = "tests/container.rs"

[[test]]
name = "hardware"
path = "tests/hardware.rs"

[[test]]
name = "wrapper"
path = "tests/wrapper.rs"
required-features = ["bridge"]

[[test]]
name = "route"
path = "tests/route.rs"
required-features = ["bridge"]

[[test]]
name = "wrapper_install"
path = "tests/wrapper_install.rs"
required-features = ["bridge"]

[[test]]
name = "hoststate"
path = "tests/hoststate.rs"
required-features = ["bridge"]

[[test]]
name = "mirror"
path = "tests/mirror.rs"
required-features = ["bridge"]

[[test]]
name = "race"
path = "tests/race.rs"
required-features = ["bridge"]

[[test]]
name = "aws"
path = "tests/aws.rs"
required-features = ["bridge"]

# Mutates AWS_REGION/AWS_DEFAULT_REGION: alone in its own process so it never races `aws`.
[[test]]
name = "aws_region"
path = "tests/aws_region.rs"
required-features = ["bridge"]

[[test]]
name = "shim_local"
path = "tests/shim_local.rs"
required-features = ["shim"]

# Opt-in (AI_ENV_DOCKER_TESTS=1, every test #[ignore]d): the shim inside the AL2023
# base image and the locally built image (`make test-docker`).
[[test]]
name = "shim_docker"
path = "tests/shim_docker.rs"
required-features = ["shim"]

# Opt-in (AI_ENV_PROXY_TESTS=1, every test #[ignore]d): squid on AL2023 with the S5 proxy
# config, reload script and allowlist (`make test-proxy`); uses the lib's log parser and hashes.
[[test]]
name = "proxy_docker"
path = "tests/proxy_docker.rs"
required-features = ["bridge"]

# S3 infra helpers through the real binary; the areas live in tests/infra/*.rs.
[[test]]
name = "infra"
path = "tests/infra.rs"
required-features = ["bridge"]

# S4 MicroVM lifecycle in-process against the fakes; the areas live in tests/vm/*.rs.
[[test]]
name = "vm"
path = "tests/vm.rs"
required-features = ["bridge"]

# Negative fixture for `make lint-negative`: clippy must REJECT it (every clippy.toml
# disallowed method is called once). Built only with the lint-negative feature.
[[example]]
name = "tls_lint_negative"
path = "examples/tls_lint_negative.rs"
required-features = ["lint-negative"]

[features]
default = ["bridge", "shim"]
# Mac side: AWS control plane, TLS client stack, WebSocket client.
bridge = [
    "dep:aws-config",
    "dep:aws-sdk-lambdamicrovms",
    "dep:aws-smithy-http-client",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "tokio-tungstenite/connect",
    # This feature is the only public way to obtain `Connector::Rustls`; it pulls
    # webpki-roots 0.26 (a re-export of the pinned 1.0.9) which tls.rs never uses —
    # the WS client installs its own root store.
    "tokio-tungstenite/rustls-tls-webpki-roots",
]
# VM side: HTTP listeners, WebSocket server via the hyper upgrade, PID-1 duties.
shim = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:nix"]
# `make lint-negative` only: builds examples/tls_lint_negative.rs, which clippy must reject.
lint-negative = ["bridge"]

[dependencies]
# classic
ai-env-age = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
libc = { workspace = true }
memsec = { workspace = true }
ratatui = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }
# every feature set
getrandom = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true } # non-optional: `handshake` in every build
futures-util = { workspace = true } # the S4 shell pump (vm/shell.rs); the S6 agent pump
http = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true } # S2 pump: fresh request ids (v7) for a replay
subtle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = { workspace = true }
# bridge
aws-config = { workspace = true, optional = true }
aws-sdk-lambdamicrovms = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true } # built by src/bridge/tls.rs only (`make lint` greps)
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# shim
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true } # S6 WebSocket upgrade extractor (not consumed before then; cargo-machete allowlist above)
hyper-util = { workspace = true, optional = true } # S6 WebSocket upgrade extractor (not consumed before then; cargo-machete allowlist above)
http-body-util = { workspace = true, optional = true } # S6 WebSocket upgrade extractor (not consumed before then; cargo-machete allowlist above)
nix = { workspace = true, optional = true } # S3 PID-1 init, signals, prctl

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
